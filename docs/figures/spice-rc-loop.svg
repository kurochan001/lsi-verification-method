<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" style="max-width:100%;height:auto" role="img" aria-labelledby="spice-rc-loop-title spice-rc-loop-desc">
<title id="spice-rc-loop-title">RTLとSPICE：RC回路の接続と制御の戻り道</title>
<desc id="spice-rc-loop-desc">理想電圧源Vdriveはdacノードと接地間、抵抗Rplantはdacとfiltered間、コンデンサーCplantはfilteredと接地間に接続する。filteredの電圧を理想ADCでRTLへ渡し、driveを外部電圧源へ戻す。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#243746"/></marker>
<pattern id="outside" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#eef2f5"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#cbd5dc" stroke-width="1"/></pattern>
</defs>
<style>text{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif} .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace} .wire{fill:none;stroke:#243746;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="960" height="650" fill="white"/>
<text x="36" y="44" font-size="26" text-anchor="start" fill="#243746" font-weight="700">RTLとSPICE：RC回路の接続と制御の戻り道</text>
<text x="36" y="79" font-size="19" text-anchor="start" fill="#243746" font-weight="400">実線はRC回路の接続、破線はC++接続部を介した観測・制御。</text>
