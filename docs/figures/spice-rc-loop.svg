<text x="800" y="334" font-size="22" text-anchor="middle" fill="#243746" font-weight="600">RTL制御器</text>
<text x="800" y="371" font-size="20" text-anchor="middle" fill="#243746" font-weight="400">ヒステリシス</text>
<path d="M800 398 V490 H85 V250 H121" fill="none" stroke="#a4510b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="430" y="524" font-size="20" text-anchor="middle" fill="#a4510b" font-weight="400">drive → 0 V / VDD（理想DAC・外部電圧源）</text>
<text x="36" y="584" font-size="19" text-anchor="start" fill="#243746" font-weight="400">境界T：v(T)を採用 → ADC化 → RTL更新 → 新driveをTより後へ反映</text>
<text x="36" y="625" font-size="19" text-anchor="start" fill="#243746" font-weight="400">デジタルresetでも、Cplantの電圧状態は過渡解析内で継続する。</text>
