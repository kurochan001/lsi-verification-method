<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception -->
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" style="max-width:100%;height:auto" role="img" aria-labelledby="gray-pointer-sampling-title gray-pointer-sampling-desc">
<title id="gray-pointer-sampling-title">Gray符号：送信元の1ビット変化と飛び越し観測</title>
<desc id="gray-pointer-sampling-desc">送信元の3ビットGray値は000、001、011、010、110と1ビットずつ変わる。受信側の連続観測が000から011へ進むと2ビット異なるが、更新を飛び越す場合には正常である。同期段数と時間は省略する。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#243746"/></marker>
<pattern id="outside" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#eef2f5"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#cbd5dc" stroke-width="1"/></pattern>
</defs>
<style>text{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif} .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace} .wire{fill:none;stroke:#243746;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="960" height="530" fill="white"/>
<text x="36" y="44" font-size="26" text-anchor="start" fill="#243746" font-weight="700">Gray符号：送信元の1ビット変化と飛び越し観測</text>
<text x="36" y="79" font-size="18" text-anchor="start" fill="#243746" font-weight="400">送信元の各更新と、受信側の連続サンプルでは、確認する条件が異なる。</text>
<text x="36" y="118" font-size="21" text-anchor="start" fill="#243746" font-weight="600">送信元の更新順</text>
<g id="gray-0" data-binary="0" data-gray="000">
<rect x="100" y="150" width="120" height="88" fill="#e8f2ff" stroke="#175ca6" stroke-width="2" rx="8"/>
<text x="160" y="176" font-size="18" text-anchor="middle" fill="#243746" font-weight="400" class="mono">bin = 0</text>
<text x="160" y="216" font-size="31" text-anchor="middle" fill="#175ca6" font-weight="600" class="mono">000</text>
</g>
<line x1="225" y1="194" x2="255" y2="194" stroke="#175ca6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="240" y="141" font-size="17" text-anchor="middle" fill="#175ca6" font-weight="400">1 bit</text>
<g id="gray-1" data-binary="1" data-gray="001">
<rect x="260" y="150" width="120" height="88" fill="#e8f2ff" stroke="#175ca6" stroke-width="2" rx="8"/>
<text x="320" y="176" font-size="18" text-anchor="middle" fill="#243746" font-weight="400" class="mono">bin = 1</text>
<text x="320" y="216" font-size="31" text-anchor="middle" fill="#175ca6" font-weight="600" class="mono">001</text>
</g>
<line x1="385" y1="194" x2="415" y2="194" stroke="#175ca6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="141" font-size="17" text-anchor="middle" fill="#175ca6" font-weight="400">1 bit</text>
<g id="gray-2" data-binary="2" data-gray="011">
<rect x="420" y="150" width="120" height="88" fill="#e8f2ff" stroke="#175ca6" stroke-width="2" rx="8"/>
<text x="480" y="176" font-size="18" text-anchor="middle" fill="#243746" font-weight="400" class="mono">bin = 2</text>
<text x="480" y="216" font-size="31" text-anchor="middle" fill="#175ca6" font-weight="600" class="mono">011</text>
</g>
<line x1="545" y1="194" x2="575" y2="194" stroke="#175ca6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560" y="141" font-size="17" text-anchor="middle" fill="#175ca6" font-weight="400">1 bit</text>
<g id="gray-3" data-binary="3" data-gray="010">
<rect x="580" y="150" width="120" height="88" fill="#e8f2ff" stroke="#175ca6" stroke-width="2" rx="8"/>
<text x="640" y="176" font-size="18" text-anchor="middle" fill="#243746" font-weight="400" class="mono">bin = 3</text>
<text x="640" y="216" font-size="31" text-anchor="middle" fill="#175ca6" font-weight="600" class="mono">010</text>
</g>
<line x1="705" y1="194" x2="735" y2="194" stroke="#175ca6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="720" y="141" font-size="17" text-anchor="middle" fill="#175ca6" font-weight="400">1 bit</text>
<g id="gray-4" data-binary="4" data-gray="110">
<rect x="740" y="150" width="120" height="88" fill="#e8f2ff" stroke="#175ca6" stroke-width="2" rx="8"/>
<text x="800" y="176" font-size="18" text-anchor="middle" fill="#243746" font-weight="400" class="mono">bin = 4</text>
<text x="800" y="216" font-size="31" text-anchor="middle" fill="#175ca6" font-weight="600" class="mono">110</text>
</g>
<text x="36" y="300" font-size="21" text-anchor="start" fill="#243746" font-weight="600">受信側の</text>
<text x="36" y="328" font-size="21" text-anchor="start" fill="#243746" font-weight="600">連続観測の例</text>
<g id="sampled-0" data-sampled-binary="0" data-sampled-gray="000">
<rect x="220" y="365" width="180" height="82" fill="#dff2ee" stroke="#087b75" stroke-width="2" rx="8"/>
<text x="310" y="418" font-size="32" text-anchor="middle" fill="#087b75" font-weight="600" class="mono">000</text>
</g>
<line x1="160" y1="246" x2="310" y2="355" stroke="#087b75" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<g id="sampled-2" data-sampled-binary="2" data-sampled-gray="011">
<rect x="590" y="365" width="180" height="82" fill="#dff2ee" stroke="#087b75" stroke-width="2" rx="8"/>
<text x="680" y="418" font-size="32" text-anchor="middle" fill="#087b75" font-weight="600" class="mono">011</text>
</g>
<line x1="480" y1="246" x2="680" y2="355" stroke="#087b75" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<line x1="415" y1="406" x2="575" y2="406" stroke="#087b75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="495" y="384" font-size="19" text-anchor="middle" fill="#087b75" font-weight="600">2 bit異なる</text>
<text x="36" y="500" font-size="18" text-anchor="start" fill="#243746" font-weight="400">同期FFの段数・遅延は省略。受信側の連続サンプルに1 bit変化を要求しない。</text>
</svg>
