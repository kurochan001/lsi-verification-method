<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" style="max-width:100%;height:auto" role="img" aria-labelledby="ready-valid-hold-title ready-valid-hold-desc">
<title id="ready-valid-hold-title">ready/valid：待ち中の保持と受理エッジ</title>
<desc id="ready-valid-hold-desc">説明用の出力波形。E2とE3はvalidが1、readyが0でデータAを保持する。E4でA、E5でBを受理し、無効期間のdataは規定しない。</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#243746"/></marker>
<pattern id="outside" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#eef2f5"/><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#cbd5dc" stroke-width="1"/></pattern>
</defs>
<style>text{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif} .mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace} .wire{fill:none;stroke:#243746;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}</style>
<rect x="0" y="0" width="960" height="550" fill="white"/>
<text x="36" y="44" font-size="26" text-anchor="start" fill="#243746" font-weight="700">ready/valid：待ち中の保持と受理エッジ</text>
<text x="36" y="78" font-size="18" text-anchor="start" fill="#243746" font-weight="400">説明用の波形例。各立上りで、その直前の valid と ready を判定する。</text>
<rect x="295" y="182" width="220" height="202" fill="#fff3d8" rx="8"/>
<line x1="240" y1="110" x2="240" y2="435" stroke="#b9c5cf" stroke-width="1" stroke-dasharray="4 5"/>
<text x="240" y="104" font-size="18" text-anchor="middle" fill="#243746" font-weight="600">E1</text>
<g id="edge-1" data-edge="1" data-valid="0" data-ready="1" data-payload="-" data-transfer="0">
<circle cx="240" cy="422" r="6" fill="white" stroke="#9aa9b4" stroke-width="2"/>
<text x="240" y="455" font-size="19" text-anchor="middle" fill="#243746" font-weight="600">—</text>
</g>
<line x1="350" y1="110" x2="350" y2="435" stroke="#b9c5cf" stroke-width="1" stroke-dasharray="4 5"/>
<text x="350" y="104" font-size="18" text-anchor="middle" fill="#243746" font-weight="600">E2</text>
<g id="edge-2" data-edge="2" data-valid="1" data-ready="0" data-payload="A" data-transfer="0">
<circle cx="350" cy="422" r="6" fill="white" stroke="#9aa9b4" stroke-width="2"/>
<text x="350" y="455" font-size="19" text-anchor="middle" fill="#243746" font-weight="600">—</text>
</g>
<line x1="460" y1="110" x2="460" y2="435" stroke="#b9c5cf" stroke-width="1" stroke-dasharray="4 5"/>
<text x="460" y="104" font-size="18" text-anchor="middle" fill="#243746" font-weight="600">E3</text>
<g id="edge-3" data-edge="3" data-valid="1" data-ready="0" data-payload="A" data-transfer="0">
<circle cx="460" cy="422" r="6" fill="white" stroke="#9aa9b4" stroke-width="2"/>
<text x="460" y="455" font-size="19" text-anchor="middle" fill="#243746" font-weight="600">—</text>
</g>
<line x1="570" y1="110" x2="570" y2="435" stroke="#b9c5cf" stroke-width="1" stroke-dasharray="4 5"/>
<text x="570" y="104" font-size="18" text-anchor="middle" fill="#243746" font-weight="600">E4</text>
<g id="edge-4" data-edge="4" data-valid="1" data-ready="1" data-payload="A" data-transfer="1">
<circle cx="570" cy="422" r="6" fill="#087b75" stroke="#087b75" stroke-width="2"/>
<text x="570" y="455" font-size="19" text-anchor="middle" fill="#243746" font-weight="600">A</text>
</g>
<line x1="680" y1="110" x2="680" y2="435" stroke="#b9c5cf" stroke-width="1" stroke-dasharray="4 5"/>
<text x="680" y="104" font-size="18" text-anchor="middle" fill="#243746" font-weight="600">E5</text>
<g id="edge-5" data-edge="5" data-valid="1" data-ready="1" data-payload="B" data-transfer="1">
<circle cx="680" cy="422" r="6" fill="#087b75" stroke="#087b75" stroke-width="2"/>
<text x="680" y="455" font-size="19" text-anchor="middle" fill="#243746" font-weight="600">B</text>
</g>
<line x1="790" y1="110" x2="790" y2="435" stroke="#b9c5cf" stroke-width="1" stroke-dasharray="4 5"/>
<text x="790" y="104" font-size="18" text-anchor="middle" fill="#243746" font-weight="600">E6</text>
<g id="edge-6" data-edge="6" data-valid="0" data-ready="1" data-payload="-" data-transfer="0">
<circle cx="790" cy="422" r="6" fill="white" stroke="#9aa9b4" stroke-width="2"/>
<text x="790" y="455" font-size="19" text-anchor="middle" fill="#243746" font-weight="600">—</text>
</g>
<text x="35" y="142" font-size="21" text-anchor="start" fill="#243746" font-weight="400" class="mono">clk</text>
<text x="35" y="221" font-size="21" text-anchor="start" fill="#243746" font-weight="400" class="mono">m_valid</text>
<text x="35" y="281" font-size="21" text-anchor="start" fill="#243746" font-weight="400" class="mono">m_ready</text>
<text x="35" y="352" font-size="21" text-anchor="start" fill="#243746" font-weight="400" class="mono">m_data</text>
<text x="35" y="427" font-size="21" text-anchor="start" fill="#243746" font-weight="400">受理データ</text>
<path d="M185 155 L240 155 L240 125 L295 125 L295 155 L350 155 L350 125 L405 125 L405 155 L460 155 L460 125 L515 125 L515 155 L570 155 L570 125 L625 125 L625 155 L680 155 L680 125 L735 125 L735 155 L790 155 L790 125 L845 125 L845 155" fill="none" stroke="#243746" stroke-width="2.5"/>
<path d="M185 231 L295 231 L295 201 L405 201 L405 201 L515 201 L515 201 L625 201 L625 201 L735 201 L735 231 L845 231" fill="none" stroke="#175ca6" stroke-width="3" id="valid-wave"/>
<path d="M185 261 L295 261 L295 291 L405 291 L405 291 L515 291 L515 261 L625 261 L625 261 L735 261 L735 261 L845 261" fill="none" stroke="#087b75" stroke-width="3" id="ready-wave"/>
<path d="M185 347 L193 328 H287 L295 347 L287 366 H193 Z" fill="#eef2f5" stroke="#9aa9b4" stroke-width="2"/>
<text x="240.0" y="354" font-size="20" text-anchor="middle" fill="#243746" font-weight="600">不問</text>
<path d="M295 347 L303 328 H617 L625 347 L617 366 H303 Z" fill="#e8f2ff" stroke="#175ca6" stroke-width="2"/>
<text x="460.0" y="354" font-size="20" text-anchor="middle" fill="#243746" font-weight="600">A</text>
<path d="M625 347 L633 328 H727 L735 347 L727 366 H633 Z" fill="#e8f2ff" stroke="#175ca6" stroke-width="2"/>
<text x="680.0" y="354" font-size="20" text-anchor="middle" fill="#243746" font-weight="600">B</text>
<path d="M735 347 L743 328 H837 L845 347 L837 366 H743 Z" fill="#eef2f5" stroke="#9aa9b4" stroke-width="2"/>
<text x="790.0" y="354" font-size="20" text-anchor="middle" fill="#243746" font-weight="600">不問</text>
<text x="36" y="500" font-size="19" text-anchor="start" fill="#243746" font-weight="400">E2・E3：valid=1 / ready=0 のため、Aとvalidを保持する。</text>
<text x="36" y="532" font-size="19" text-anchor="start" fill="#243746" font-weight="400">E4でAを受理し、E5でBを連続受理。無効中のdataは不問。</text>
</svg>
