variables:
  APB_IRQ_DEMO_BUG: "0"
  APB_IRQ_REGRESSION_SEED: "17"

apb-irq-runner-tests:
  stage: validate
  timeout: 10m
  script:
    - python3 -m unittest discover -s examples/gitlab-apb-irq/tests -v

apb-irq-regression:
  stage: regression
  timeout: 10m
  parallel:
    matrix:
      - APB_IRQ_WAIT: ["0", "1", "3"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        APB_IRQ_PROFILE: nightly
    - when: on_success
      variables:
        APB_IRQ_PROFILE: smoke
  script:
    - python3 examples/gitlab-apb-irq/run.py --wait "$APB_IRQ_WAIT" --profile "$APB_IRQ_PROFILE" --seed "$APB_IRQ_REGRESSION_SEED" --demo-bug "$APB_IRQ_DEMO_BUG" --out "artifacts/apb-irq-wait${APB_IRQ_WAIT}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/apb-irq-*/
    reports:
      junit: artifacts/apb-irq-*/junit.xml
