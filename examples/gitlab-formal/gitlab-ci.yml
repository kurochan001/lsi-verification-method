variables:
  FORMAL_DEMO_BUG: "0"

formal-runner-tests:
  stage: validate
  image: python:3.11-slim-bookworm
  before_script: []
  timeout: 10m
  script:
    - python3 -m unittest discover -s examples/gitlab-formal/tests -v

fifo-formal:
  stage: regression
  image: python:3.11-slim-bookworm
  timeout: 10m
  before_script:
    - python3 -m pip install --disable-pip-version-check -r examples/gitlab-formal/tools-requirements.txt
  parallel:
    matrix:
      - FORMAL_FIFO_DEPTH: ["1", "3"]
  script:
    - python3 examples/gitlab-formal/run.py --depth "$FORMAL_FIFO_DEPTH" --demo-bug "$FORMAL_DEMO_BUG" --out "artifacts/formal-d${FORMAL_FIFO_DEPTH}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/formal-*/
    reports:
      junit: artifacts/formal-*/junit.xml
