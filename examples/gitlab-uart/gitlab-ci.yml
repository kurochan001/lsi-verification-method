variables:
  UART_DEMO_BUG: "0"
  UART_REGRESSION_SEED: "17"

uart-runner-tests:
  stage: validate
  timeout: 10m
  script:
    - python3 -m unittest discover -s examples/gitlab-uart/tests -v

uart-regression:
  stage: regression
  timeout: 10m
  parallel:
    matrix:
      - UART_DIVISOR: ["8", "16"]
        UART_PARITY: ["0", "1", "2"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        UART_PROFILE: nightly
    - when: on_success
      variables:
        UART_PROFILE: smoke
  script:
    - python3 examples/gitlab-uart/run.py --divisor "$UART_DIVISOR" --parity "$UART_PARITY" --profile "$UART_PROFILE" --seed "$UART_REGRESSION_SEED" --demo-bug "$UART_DEMO_BUG" --out "artifacts/uart-div${UART_DIVISOR}-parity${UART_PARITY}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/uart-*/
    reports:
      junit: artifacts/uart-*/junit.xml
