variables:
  ARB_DEMO_BUG: "0"
  ARB_REGRESSION_SEED: "17"

arbiter-runner-tests:
  stage: validate
  timeout: 10m
  script:
    - python3 -m unittest discover -s examples/gitlab-arbiter/tests -v

arbiter-regression:
  stage: regression
  timeout: 10m
  parallel:
    matrix:
      - ARB_PORTS: ["2", "3", "4"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        ARB_PROFILE: nightly
    - when: on_success
      variables:
        ARB_PROFILE: smoke
  script:
    - python3 examples/gitlab-arbiter/run.py --ports "$ARB_PORTS" --profile "$ARB_PROFILE" --seed "$ARB_REGRESSION_SEED" --demo-bug "$ARB_DEMO_BUG" --out "artifacts/arbiter-p${ARB_PORTS}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/arbiter-*/
    reports:
      junit: artifacts/arbiter-*/junit.xml
