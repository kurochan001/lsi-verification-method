variables:
  SVA_DEMO_BUG: "0"
  SVA_REGRESSION_SEED: "17"

sva-runner-tests:
  stage: validate
  image: python:3.11-slim-bookworm
  before_script: []
  timeout: 10m
  script:
    - python3 -m unittest discover -s examples/gitlab-sva/tests -v

sva-regression:
  stage: regression
  timeout: 10m
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends python3 verilator g++ make
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        SVA_PROFILE: nightly
    - when: on_success
      variables:
        SVA_PROFILE: smoke
  script:
    - python3 examples/gitlab-sva/run.py --profile "$SVA_PROFILE" --seed "$SVA_REGRESSION_SEED" --demo-bug "$SVA_DEMO_BUG" --out artifacts/sva
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/sva/
    reports:
      junit: artifacts/sva/junit.xml
