variables:
  STREAM_DEMO_BUG: "0"
  STREAM_REGRESSION_SEED: "17"

stream-runner-tests:
  stage: validate
  timeout: 10m
  script:
    - python3 -m unittest discover -s examples/gitlab-stream/tests -v

stream-regression:
  stage: regression
  timeout: 10m
  parallel:
    matrix:
      - STREAM_DEPTH: ["1", "3"]
        STREAM_WIDTH: ["8", "16"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        STREAM_PROFILE: nightly
    - when: on_success
      variables:
        STREAM_PROFILE: smoke
  script:
    - python3 examples/gitlab-stream/run.py --depth "$STREAM_DEPTH" --width "$STREAM_WIDTH" --profile "$STREAM_PROFILE" --seed "$STREAM_REGRESSION_SEED" --demo-bug "$STREAM_DEMO_BUG" --out "artifacts/stream-d${STREAM_DEPTH}-w${STREAM_WIDTH}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/stream-*/
    reports:
      junit: artifacts/stream-*/junit.xml
