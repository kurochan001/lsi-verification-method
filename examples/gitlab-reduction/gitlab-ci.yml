variables:
  REDUCTION_DEMO_BUG: "0"
  REDUCTION_SEED: "17"

reduction-runner-tests:
  stage: validate
  timeout: 10m
  script:
    - python3 -m unittest discover -s examples/gitlab-reduction/tests -v

reduction-comparison:
  stage: regression
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        REDUCTION_PROFILE: nightly
    - when: on_success
      variables:
        REDUCTION_PROFILE: smoke
  script:
    - python3 examples/gitlab-reduction/run.py --profile "$REDUCTION_PROFILE" --seed "$REDUCTION_SEED" --demo-bug "$REDUCTION_DEMO_BUG" --out artifacts/reduction
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/reduction/
    reports:
      junit: artifacts/reduction/junit.xml
