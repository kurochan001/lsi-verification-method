stages:
  - validate
  - regression

default:
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends python3 iverilog

variables:
  # Set to "1" in Run pipeline to demonstrate a failing normal regression.
  IRQ_DEMO_BUG: "0"
  REGRESSION_SEED: "17"

runner-tests:
  stage: validate
  timeout: 10m
  script:
    - python3 -m unittest discover -s examples/gitlab-regression/tests -v

irq-regression:
  stage: regression
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        REGRESSION_PROFILE: nightly
    - when: on_success
      variables:
        REGRESSION_PROFILE: smoke
  script:
    - python3 examples/gitlab-regression/run.py --profile "$REGRESSION_PROFILE" --seed "$REGRESSION_SEED" --demo-bug "$IRQ_DEMO_BUG" --out artifacts/irq
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/irq/
    reports:
      junit: artifacts/irq/junit.xml
