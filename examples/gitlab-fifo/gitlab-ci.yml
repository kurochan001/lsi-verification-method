variables:
  FIFO_DEMO_BUG: "0"
  FIFO_REGRESSION_SEED: "17"

fifo-runner-tests:
  stage: validate
  timeout: 10m
  script:
    - python3 -m unittest discover -s examples/gitlab-fifo/tests -v

fifo-regression:
  stage: regression
  timeout: 10m
  parallel:
    matrix:
      - FIFO_DEPTH: ["1", "3", "8"]
        FIFO_WIDTH: ["8", "16"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        FIFO_PROFILE: nightly
    - when: on_success
      variables:
        FIFO_PROFILE: smoke
  script:
    - python3 examples/gitlab-fifo/run.py --depth "$FIFO_DEPTH" --width "$FIFO_WIDTH" --profile "$FIFO_PROFILE" --seed "$FIFO_REGRESSION_SEED" --demo-bug "$FIFO_DEMO_BUG" --out "artifacts/fifo-d${FIFO_DEPTH}-w${FIFO_WIDTH}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/fifo-*/
    reports:
      junit: artifacts/fifo-*/junit.xml
