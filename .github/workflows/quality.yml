name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/docs-requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/docs/package-lock.json
      - name: Prepare and diagnose document environment
        run: python tools/setup_environment.py --profile docs --out artifacts/ci-env
      - name: Check documents and diagrams
        run: artifacts/ci-env/python/bin/python tools/check_docs.py --out artifacts/ci/docs
      - name: Check repository tools
        run: artifacts/ci-env/python/bin/python tools/run_selftests.py --scope tools --out artifacts/ci/tool-selftests
      - name: Preserve results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documents-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ci/**
            artifacts/ci-env/*.log
            artifacts/ci-env/manifest.json
            artifacts/ci-env/summary.json
            artifacts/ci-env/junit.xml
            artifacts/ci-env/diagnosis/**
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Native build prerequisites
        timeout-minutes: 10
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt && "$(dpkg --print-architecture)" == amd64 ]]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          lsi_apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${lsi_apt_options[@]}" update --error-on=any
          sudo apt-get "${lsi_apt_options[@]}" install -y autoconf automake bison flex g++ gcc gperf help2man libfl-dev make perl zlib1g-dev
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: native
        with:
          path: artifacts/ci-native
          key: native-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/environment.json', 'tools/build_native.py', 'tools/quality_common.py') }}
      - name: Build fixed native sources
        if: steps.native.outputs.cache-hit != 'true'
        run: python tools/build_native.py --profile smoke --jobs 2 --out artifacts/ci-native
      - name: Prepare and diagnose smoke environment
        run: python tools/setup_environment.py --profile smoke --tool-bin "$PWD/artifacts/ci-native/install/bin" --out artifacts/ci-env
      - name: Save diagnosed native tools before verification
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/ci-native
          key: ${{ steps.native.outputs.cache-primary-key }}
      - name: FIFO, APB, stream and native SVA smoke
        run: >-
          artifacts/ci-env/python/bin/python tools/run_regression.py
          --profile smoke --jobs 2 --command-timeout 60 --build-timeout 600
          --example local-fifo --example local-apb --example local-stream --example local-sva
          --python "$PWD/artifacts/ci-env/python/bin/python"
          --tool-bin "$PWD/artifacts/ci-native/install/bin"
          --out artifacts/ci/smoke
      - name: Preserve results, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/ci/**/manifest.json
            artifacts/ci/**/summary.json
            artifacts/ci/**/*.xml
            artifacts/ci/**/*.log
            artifacts/ci/**/result.json
            artifacts/ci/**/coverage.json
            artifacts/ci/**/coverage.dat
            artifacts/ci/**/vectors.txt
            artifacts/ci/**/*.hex
            artifacts/ci-env/*.log
            artifacts/ci-env/diagnosis/**
            artifacts/ci-native/logs/**
            artifacts/ci-native/native-sources.json
