workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

include:
  - local: /examples/gitlab-regression/gitlab-ci.yml
  - local: /examples/gitlab-fifo/gitlab-ci.yml
  - local: /examples/gitlab-formal/gitlab-ci.yml
  - local: /examples/gitlab-apb/gitlab-ci.yml
  - local: /examples/gitlab-apb-irq/gitlab-ci.yml
  - local: /examples/gitlab-stream/gitlab-ci.yml
  - local: /examples/gitlab-sva/gitlab-ci.yml
  - local: /examples/gitlab-reduction/gitlab-ci.yml
  - local: /examples/gitlab-arbiter/gitlab-ci.yml
  - local: /examples/gitlab-uart/gitlab-ci.yml
